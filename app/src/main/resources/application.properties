spring.application.name=capstone-api
server.port=${SERVER_PORT:8080}

# Snowflake connection base
snowflake.account=${SNOWFLAKE_HOST:FQ39967.ap-southeast-7.aws.snowflakecomputing.com}
snowflake.warehouse=${SNOWFLAKE_WAREHOUSE:CAPSTONE_WH}
snowflake.database=${SNOWFLAKE_DATABASE:CAPSTONE_DB}
snowflake.schema=ANALYTICS

# Per-tenant user credentials (injected at runtime — never hardcode)
snowflake.users.TENANT_A_ANALYST.user=${SNOWFLAKE_TENANT_A_USER:TENANT_A_USER}
snowflake.users.TENANT_A_ANALYST.password=${SNOWFLAKE_TENANT_A_PASSWORD:}
snowflake.users.TENANT_B_ANALYST.user=${SNOWFLAKE_TENANT_B_USER:TENANT_B_USER}
snowflake.users.TENANT_B_ANALYST.password=${SNOWFLAKE_TENANT_B_PASSWORD:}
snowflake.users.CAPSTONE_SUPPORT.user=${SNOWFLAKE_SUPPORT_USER:SUPPORT_USER}
snowflake.users.CAPSTONE_SUPPORT.password=${SNOWFLAKE_SUPPORT_PASSWORD:}
snowflake.users.POWERBI_TENANT_A.user=${SNOWFLAKE_POWERBI_A_USER:POWERBI_A_USER}
snowflake.users.POWERBI_TENANT_A.password=${SNOWFLAKE_POWERBI_A_PASSWORD:}
snowflake.users.POWERBI_TENANT_B.user=${SNOWFLAKE_POWERBI_B_USER:POWERBI_B_USER}
snowflake.users.POWERBI_TENANT_B.password=${SNOWFLAKE_POWERBI_B_PASSWORD:}

# Admin user (setup/monitoring only — not used for tenant queries)
snowflake.admin.user=${SNOWFLAKE_ADMIN_USER:ARYAN05}
snowflake.admin.password=${SNOWFLAKE_ADMIN_PASSWORD:${SNOWFLAKE_PASSWORD:}}

# Demo session secret
app.session.secret=${APP_SESSION_SECRET:dev-secret-change-in-production}
