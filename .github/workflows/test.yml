name: CAP-30 CI — Lint, Deploy, Access Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ── 1. Lint SQL files ──────────────────────────────────────────
  lint-sql:
    name: SQL Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install sqlfluff
        run: pip install sqlfluff
      - name: Lint SQL files
        run: |
          sqlfluff lint sql/ --dialect snowflake --ignore parsing || true
          # Non-fatal for now — sqlfluff Snowflake dialect is best-effort

  # ── 2. Python unit / access tests ─────────────────────────────
  access-tests:
    name: Access Tests (28 original + extended)
    runs-on: ubuntu-latest
    needs: lint-sql
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      # The Snowflake hostname failed to resolve on the runner twice
      # ("Temporary failure in name resolution"). This step only warns —
      # it never fails the job — and falls back to Google DNS if the
      # runner's resolver cannot see the host.
      - name: Check Snowflake DNS (diagnostic + fallback)
        env:
          SNOWFLAKE_HOST: ${{ secrets.SNOWFLAKE_HOST }}
        run: |
          python3 - <<'EOF'
          import os, socket, subprocess
          host = os.environ.get("SNOWFLAKE_HOST") or "FQ39967.ap-southeast-7.aws.snowflakecomputing.com"
          try:
              print("DNS OK:", host, "->", socket.gethostbyname(host))
          except Exception as e:
              print(f"::warning::DNS lookup failed for {host}: {e} — trying Google DNS")
              subprocess.run(["sudo", "sh", "-c", "echo 'nameserver 8.8.8.8' > /etc/resolv.conf"], check=False)
              try:
                  print("After fallback:", host, "->", socket.gethostbyname(host))
              except Exception as e2:
                  print(f"::warning::DNS still failing after fallback: {e2}")
          EOF

      - name: Run original access tests
        run: |
          ok=0
          for i in 1 2 3; do
            if python tests/run_access_tests.py; then ok=1; break; fi
            echo "Attempt $i failed — retrying in 30s ..."
            sleep 30
          done
          [ "$ok" = 1 ]
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_HOST:      ${{ secrets.SNOWFLAKE_HOST }}
          SNOWFLAKE_ADMIN_USER:      ${{ secrets.SNOWFLAKE_ADMIN_USER }}
          SNOWFLAKE_ADMIN_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_TENANT_A_USER:     ${{ secrets.SNOWFLAKE_TENANT_A_USER }}
          SNOWFLAKE_TENANT_A_PASSWORD: ${{ secrets.SNOWFLAKE_TENANT_A_PASSWORD }}
          SNOWFLAKE_TENANT_B_USER:     ${{ secrets.SNOWFLAKE_TENANT_B_USER }}
          SNOWFLAKE_TENANT_B_PASSWORD: ${{ secrets.SNOWFLAKE_TENANT_B_PASSWORD }}
          SNOWFLAKE_SUPPORT_USER:      ${{ secrets.SNOWFLAKE_SUPPORT_USER }}
          SNOWFLAKE_SUPPORT_PASSWORD:  ${{ secrets.SNOWFLAKE_SUPPORT_PASSWORD }}
          SNOWFLAKE_POWERBI_A_USER:     ${{ secrets.SNOWFLAKE_POWERBI_A_USER }}
          SNOWFLAKE_POWERBI_A_PASSWORD: ${{ secrets.SNOWFLAKE_POWERBI_A_PASSWORD }}
          SNOWFLAKE_POWERBI_B_USER:     ${{ secrets.SNOWFLAKE_POWERBI_B_USER }}
          SNOWFLAKE_POWERBI_B_PASSWORD: ${{ secrets.SNOWFLAKE_POWERBI_B_PASSWORD }}

      - name: Run extended isolation tests (T10-T19)
        run: |
          mkdir -p reports
          ok=0
          for i in 1 2 3; do
            if pytest tests/test_isolation_extended.py -v --junitxml=reports/extended_results.xml; then ok=1; break; fi
            echo "Attempt $i failed — retrying in 30s ..."
            sleep 30
          done
          [ "$ok" = 1 ]
        env:
          SNOWFLAKE_ACCOUNT:            ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_HOST:               ${{ secrets.SNOWFLAKE_HOST }}
          SNOWFLAKE_ADMIN_USER:         ${{ secrets.SNOWFLAKE_ADMIN_USER }}
          SNOWFLAKE_ADMIN_PASSWORD:     ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_TENANT_A_USER:      ${{ secrets.SNOWFLAKE_TENANT_A_USER }}
          SNOWFLAKE_TENANT_A_PASSWORD:  ${{ secrets.SNOWFLAKE_TENANT_A_PASSWORD }}
          SNOWFLAKE_TENANT_B_USER:      ${{ secrets.SNOWFLAKE_TENANT_B_USER }}
          SNOWFLAKE_TENANT_B_PASSWORD:  ${{ secrets.SNOWFLAKE_TENANT_B_PASSWORD }}
          SNOWFLAKE_SUPPORT_USER:       ${{ secrets.SNOWFLAKE_SUPPORT_USER }}
          SNOWFLAKE_SUPPORT_PASSWORD:   ${{ secrets.SNOWFLAKE_SUPPORT_PASSWORD }}
          # T12 (expiry test, 70s) disabled in CI — run locally with SLOW_TESTS=1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/

  # ── 3. Build Spring Boot API ───────────────────────────────────
  build-api:
    name: Build Spring Boot API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build with Maven (skip tests — Snowflake not available in CI build)
        run: |
          cd app
          mvn package -DskipTests --no-transfer-progress
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: capstone-api-jar
          path: app/target/*.jar

  # ── 4. Build React frontend ────────────────────────────────────
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm run build
